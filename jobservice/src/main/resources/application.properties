spring.application.name=jobservice


server.port=8081
spring.cloud.compatibility-verifier.enabled=false



# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate Dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show SQL Queries
spring.jpa.show-sql=true

# Automatically create/drop schema on startup
spring.jpa.hibernate.ddl-auto=update

# H2 Console Access (Optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Enable H2 Console for testing (Optional)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console



eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/



management.Training.sampling.probability=1.0

